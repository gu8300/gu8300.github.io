<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>特斯拉管家授權</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 {
      font-size: 1.7rem;
      line-height: 1.3;
      margin: 0 0 1rem;
    }
    .steps {
      margin: 0 0 1.25rem;
      font-size: 1.05rem;
    }
    input, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: 1.15rem;
      border-radius: 0.6rem;
    }
    input {
      padding: 0.95rem 1rem;
      border: 1px solid #c5cdd6;
      margin: 0 0 0.85rem;
      background: #fff;
    }
    button {
      padding: 1rem;
      border: 0;
      background: #1a73e8;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    #msg {
      min-height: 1.5em;
      margin: 0.85rem 0 0;
      color: #b00020;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>特斯拉管家授權</h1>
    <p class="steps">1. 到 developer.tesla.com 你的應用程式『查看細節』複製 Client ID，貼在下面。 2. 按按鈕登入 Tesla 並同意授權。 3. 跳轉後複製授權碼，貼進管家的保密欄位。</p>
    <input id="cid" type="text" placeholder="Client ID" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button id="go" type="button">登入 Tesla 並授權</button>
    <p id="msg" role="status"></p>
  </main>
  <script>
    (function () {
      var input = document.getElementById("cid");
      var msg = document.getElementById("msg");
      document.getElementById("go").addEventListener("click", function () {
        var clientId = input.value.trim();
        if (!clientId) {
          msg.textContent = "請先貼上 Client ID";
          return;
        }
        msg.textContent = "";
        var params = new URLSearchParams();
        params.set("response_type", "code");
        params.set("client_id", clientId);
        params.set("redirect_uri", "https://gu8300.github.io/callback");
        params.set("scope", "openid offline_access vehicle_device_data vehicle_location vehicle_cmds vehicle_charging_cmds");
        params.set("state", "f970e882140cebf9d19f920b");
        params.set("locale", "zh-TW");
        params.set("prompt", "login");
        window.location.href = "https://auth.tesla.com/oauth2/v3/authorize?" + params.toString();
      });
    })();
  </script>
</body>
</html>
