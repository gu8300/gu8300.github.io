<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla OAuth callback</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      color: #1a1a1a;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 {
      font-size: 1.5rem;
      line-height: 1.3;
      margin: 0 0 1rem;
    }
    #code {
      word-break: break-all;
      white-space: pre-wrap;
      font-size: 1rem;
      background: #f4f6f8;
      padding: 0.9rem 1rem;
      border-radius: 0.6rem;
    }
    #copy {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 1rem;
      padding: 1rem;
      font-size: 1.25rem;
      font-weight: 700;
      border: 0;
      border-radius: 0.6rem;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
    }
    #copy[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
  <h1>Tesla OAuth callback</h1>
  <p id="message"></p>
  <pre id="code"></pre>
  <button id="copy" type="button" hidden>複製</button>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var error = params.get("error");
      var errorDescription = params.get("error_description");
      var message = document.getElementById("message");
      var codeEl = document.getElementById("code");
      var copyBtn = document.getElementById("copy");

      if (error) {
        message.textContent = errorDescription ? (error + ": " + errorDescription) : error;
        codeEl.hidden = true;
        return;
      }

      if (code) {
        message.textContent = "複製下面整串授權碼，貼進特斯拉管家的保密欄位，不要給別人。";
        codeEl.textContent = code;
        copyBtn.hidden = false;
        copyBtn.addEventListener("click", function () {
          navigator.clipboard.writeText(code).then(function () {
            copyBtn.textContent = "已複製";
          }).catch(function () {});
        });
        return;
      }

      message.textContent = "No authorization code was found in this address.";
      codeEl.hidden = true;
    })();
  </script>
</body>
</html>
